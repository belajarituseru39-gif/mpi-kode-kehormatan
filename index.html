        let audioCtx = null;
        const playSfx = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return; 

                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'incorrect') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2); 
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'click') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05); 
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.05);
                }
            } catch (err) {
                console.warn("Audio diblokir browser.", err);
            }
        };

        function Level4Sulawesi({ onComplete, onCorrect }) {
            const data = LEVEL_DATA[4];
            const shuffledOptions = useMemo(() => shuffleArray(data.options), [data.options]);
            
            const [filledBlanks, setFilledBlanks] = useState({});
            const [completed, setCompleted] = useState(false);
            const [feedbackMsg, setFeedbackMsg] = useState("");
            const [scoreLocal, setScoreLocal] = useState(0);

            const [selectedWord, setSelectedWord] = useState(null);
            const [dragOverId, setDragOverId] = useState(null);

            const handleDragStart = (e, opt) => { e.dataTransfer.setData("opt", JSON.stringify(opt)); };
            const handleDragOver = (e, bId) => { e.preventDefault(); setDragOverId(bId); };
            const handleDragLeave = () => setDragOverId(null);
            const handleDrop = (e, bId) => {
                e.preventDefault();
                setDragOverId(null);
                const optData = e.dataTransfer.getData("opt");
                if (optData) {
                    const opt = JSON.parse(optData);
                    setFilledBlanks(prev => ({ ...prev, [bId]: opt }));
                    setFeedbackMsg("");
                }
            };

            const handleRemove = (bId) => {
                setFilledBlanks(prev => { const newB = {...prev}; delete newB[bId]; return newB; });
                setFeedbackMsg("");
            };

            const handleWordClick = (opt) => setSelectedWord(selectedWord?.id === opt.id ? null : opt);
            const handleBlankClick = (bId) => {
                if (selectedWord) {
                    setFilledBlanks(prev => ({...prev, [bId]: selectedWord}));
                    setSelectedWord(null);
                    setFeedbackMsg("");
                } else if (filledBlanks[bId]) {
                    handleRemove(bId);
                }
            };

            const handleCheckAnswer = () => {
                if (Object.keys(filledBlanks).length < data.blanks.length) {
                    setFeedbackMsg("Lengkapi semua bagian yang rumpang di paragraf terlebih dahulu ya, Kak!");
                    return;
                }

                let correctCountLocal = 0;
                data.blanks.forEach(b => {
                    if (filledBlanks[b.id]?.text === b.correct) correctCountLocal++;
                });

                if (correctCountLocal === data.blanks.length) {
                    playSfx('correct');
                } else {
                    playSfx('incorrect');
                }

                if (onCorrect) { 
                    for(let i=0; i<correctCountLocal; i++) onCorrect(); 
                }
                
                setScoreLocal(correctCountLocal);
                setCompleted(true);
            };

            const allFilled = Object.keys(filledBlanks).length === data.blanks.length;

            return (
                <div className="flex flex-col h-full w-full max-w-[1400px] mx-auto flex-1 min-h-0 pb-4">
                    {!completed ? (
                        <div className="bg-white/95 rounded-[2rem] shadow-xl border-4 border-amber-600 flex flex-col flex-1 min-h-0 mt-4 overflow-hidden p-4 md:p-8 xl:p-12 animate-fade-in">

                                <div className="bg-amber-600 text-white p-4 xl:p-5 rounded-2xl shadow-md"><Icons.BookOpen className="w-8 h-8 md:w-10 md:h-10 xl:w-14 xl:h-14 flex-shrink-0" /></div>

                                    <span className="leading-relaxed">{data.stimulusText}</span>
                                </div>
                            </div>

                            <div className="bg-emerald-100 p-3 xl:p-4 rounded-xl border-l-4 border-emerald-600 text-center text-sm md:text-lg xl:text-xl font-bold text-emerald-900 mb-4 shadow-sm flex-shrink-0">
                                💡 {data.instruction}
                            </div>
                            
                            <div className="flex-grow overflow-y-auto custom-scrollbar pr-2 md:pr-4 flex flex-col gap-6 xl:gap-8 pb-10">
                                
                                <div className="bg-amber-50 p-4 md:p-6 xl:p-8 rounded-2xl border-2 border-dashed border-amber-400 flex flex-wrap gap-3 md:gap-4 justify-center shadow-inner min-h-[100px] flex-shrink-0 items-center">
                                    {shuffledOptions.map(opt => {
                                        const isUsed = Object.values(filledBlanks).some(b => b.id === opt.id);
                                        if (isUsed) return null;
                                        return (
                                            <div
                                                key={opt.id}
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, opt)}
                                                onClick={() => handleWordClick(opt)}

                                            >
                                                {opt.text}
                                            </div>
                                        );
                                    })}
                                    {allFilled && <span className="text-amber-800 font-bold text-sm md:text-base xl:text-xl w-full text-center">Semua ruang rumpang telah terisi.</span>}
                                </div>

                                                        onDragLeave={handleDragLeave}
                                                        onDrop={(e) => handleDrop(e, blank.id)}

                                                        className={`inline-flex items-center justify-center min-w-[140px] md:min-w-[200px] xl:min-w-[280px] h-[35px] md:h-[45px] xl:h-[60px] mx-2 md:mx-3 px-3 border-b-4 border-dashed rounded-lg transition-all cursor-pointer touch-manipulation align-middle relative ${dragOverId === blank.id || (selectedWord && !filledBlanks[blank.id]) ? 'bg-amber-100 border-amber-500 animate-pulse' : 'bg-gray-100 border-gray-400 hover:border-amber-400'} ${filledBlanks[blank.id] ? 'bg-emerald-100 border-emerald-500 border-solid shadow-sm' : ''}`}

                                                            </span>

                                                        )}
                                                    </span>
                                                )}
                                            </React.Fragment>
                                        );
                                    })}

                                </button>
                            </div>
                        </div>

                            <button onClick={onComplete} className="bg-gradient-to-b from-emerald-600 to-green-700 hover:from-emerald-500 hover:to-green-600 text-white font-black w-full py-5 xl:py-8 text-xl md:text-3xl xl:text-5xl rounded-full shadow-[0_8px_0_#064e3b] active:shadow-none active:translate-y-2 transition-all mt-8 uppercase tracking-wide touch-manipulation">Lanjut ke Puncak 🚀</button>
                        </div>
                    )}
                </div>
            );
        }

        function Level5Papua({ onComplete, saveRef, saveData }) {
            const data = LEVEL_DATA[5];
            const [rating, setRating] = useState(0);
            const [a1, setA1] = useState("");
            const [a2, setA2] = useState("");
            const [a3, setA3] = useState("");
            const [feedbackMsg, setFeedbackMsg] = useState("");

            const handleFinish = () => {
                if (rating === 0 || !a1.trim() || !a2.trim() || !a3.trim()) {
                    setFeedbackMsg("Mohon berikan rating dan isi seluruh refleksi dengan lengkap ya, Kak!");
                    return;
                }
                playSfx('correct');
                saveData('final_project', { rating, pemahaman: a1, strategi: a2, aksi: a3 });
                saveRef(a3);
                onComplete();

            return (
                <div className="flex flex-col h-full w-full max-w-[1400px] mx-auto flex-1 min-h-0 pb-4 animate-fade-in justify-center">

                            <div className="bg-amber-50 p-5 md:p-8 xl:p-10 rounded-3xl border-4 border-amber-300 shadow-sm">
                                <label className="block text-lg md:text-2xl xl:text-4xl font-black text-amber-900 mb-5 xl:mb-8 leading-relaxed">{data.questions.q2}</label>
                                <textarea rows="3" value={a2} onChange={e => setA2(e.target.value)} placeholder="Poin Dasadarma yang sulit menurutku adalah..." className="w-full p-5 md:p-6 xl:p-8 rounded-2xl border-4 border-amber-300 bg-white outline-none focus:border-amber-600 font-bold text-gray-800 text-base md:text-xl xl:text-3xl resize-none shadow-inner leading-relaxed"></textarea>
                            </div>

                            <div className="bg-emerald-50 p-5 md:p-8 xl:p-10 rounded-3xl border-4 border-emerald-300 shadow-sm">
                                <label className="block text-lg md:text-2xl xl:text-4xl font-black text-emerald-900 mb-5 xl:mb-8 leading-relaxed">{data.questions.q3}</label>
                                <textarea rows="3" value={a3} onChange={e => setA3(e.target.value)} placeholder="Misal: 'Saya akan mengamalkan Suci pikiran - Saya berjanji tidak akan menyontek saat ujian hari ini.'" className="w-full p-5 md:p-6 xl:p-8 rounded-2xl border-4 border-emerald-300 bg-white outline-none focus:border-emerald-600 font-bold text-gray-800 text-base md:text-xl xl:text-3xl resize-none shadow-inner leading-relaxed"></textarea>
                            </div>

                        </div>

                        <div className="mt-8 pt-6 border-t-4 border-amber-100 flex flex-col items-center flex-shrink-0">
                            {feedbackMsg && <p className="text-red-700 font-black text-sm md:text-base xl:text-2xl mb-5 bg-red-100 p-4 xl:p-6 rounded-2xl border-2 border-red-300 text-center w-full shadow-sm">{feedbackMsg}</p>}
                            <button onClick={handleFinish} className="bg-gradient-to-b from-amber-600 to-orange-700 hover:from-amber-500 hover:to-orange-600 text-white font-black py-4 px-10 md:py-5 xl:py-8 xl:px-20 rounded-full shadow-[0_8px_0_#78350f] active:shadow-none active:translate-y-2 transition-all text-lg md:text-2xl xl:text-4xl flex items-center justify-center gap-4 w-full md:w-auto uppercase tracking-wider touch-manipulation">
                                <Icons.Award className="w-8 h-8 md:w-10 md:h-10 xl:w-14 xl:h-14" /> Sahkan Logbook Regu!
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function EndScreen({ userData, correctCount, onRestart, playerName, playerSchool }) {
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState("idle"); 

            const handleSaveToGoogleSheets = async () => {
                if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("mock-url")) return setSaveStatus("error");
                setIsSaving(true);
                
                const payload = {
                    nama: playerName, sekolah: playerSchool, skor: correctCount, benar: correctCount,
                    ref1: "-", ref2: "-", ref3: "-", ref4: "-",
                    papua_masalah: userData.final_project?.pemahaman || "-",
                    papua_solusi: userData.final_project?.strategi || "-",
                    papua_kampanye: userData.final_project ? `Janji Dasa Darma: ${userData.final_project.aksi} | Rating: ${userData.final_project.rating}` : "-",
                };
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    setSaveStatus("success");
                } catch (error) { setSaveStatus("error"); } finally { setIsSaving(false); }
            };

            return (
                <div className="flex flex-col items-center justify-center gap-6 xl:gap-10 animate-fade-in w-full flex-1 min-h-0 overflow-y-auto pb-8 pt-4">
                  <div className="text-center bg-white/95 p-6 md:p-10 xl:p-16 rounded-[3rem] shadow-2xl w-full max-w-3xl xl:max-w-5xl border-4 border-amber-500">
                    <img src={LOGO_IMAGE_URL} alt="Logo" className="w-28 h-28 md:w-36 md:h-36 xl:w-56 xl:h-56 object-contain mx-auto animate-bounce-slow drop-shadow-2xl rounded-3xl border-4 border-white mb-6 p-2 bg-white" />
                    <h2 className="text-4xl md:text-6xl xl:text-8xl font-black text-amber-700 mt-4 xl:mt-8 drop-shadow-sm uppercase tracking-wider">SELAMAT!</h2>
                    <p className="text-xl md:text-3xl xl:text-5xl font-bold mt-4 xl:mt-6 text-gray-800">{playerName}, <br/><span className="text-emerald-700 block mt-3">Penjelajah Sejati Pramuka</span></p>
                    <div className="text-xl md:text-3xl xl:text-5xl font-black text-gray-600 mt-8 xl:mt-12 bg-amber-50 p-6 md:p-8 xl:p-10 rounded-3xl border-4 border-amber-200 shadow-inner">
                        Total Skor Penjelajahan <br/><span className="text-7xl md:text-8xl xl:text-[10rem] text-amber-600 text-outline inline-block mt-6 mb-4 drop-shadow-xl">{correctCount}</span><br/><span className="text-lg md:text-2xl xl:text-4xl text-amber-800">Bintang Tanda Kecakapan Khusus</span>
                    </div>
                  </div>

                  <div className="w-full max-w-3xl xl:max-w-5xl bg-white p-6 md:p-10 xl:p-14 rounded-[3rem] shadow-xl border-b-8 border-emerald-500 relative text-base">
                    <div className="text-center border-b-4 border-gray-100 pb-4 xl:pb-8 mb-4 xl:mb-8">
                      <h3 className="font-black text-2xl md:text-4xl xl:text-6xl text-emerald-900 uppercase tracking-wide">Janji Pandu</h3>
                      <p className="text-emerald-700 font-bold text-lg md:text-2xl xl:text-4xl mt-3 xl:mt-5 bg-emerald-50 inline-block px-6 md:px-8 py-2 md:py-3 rounded-full border border-emerald-300">{playerName} - {playerSchool}</p>
                    </div>
                    <div className="space-y-3 xl:space-y-5 max-h-48 xl:max-h-80 overflow-y-auto pr-3 custom-scrollbar text-sm md:text-base xl:text-3xl">
                      <p className="bg-amber-50 p-6 xl:p-10 rounded-3xl border-2 border-amber-200 shadow-sm text-gray-800 font-bold leading-relaxed">
                          <span className="text-amber-900 block mb-3 xl:mb-5 font-black uppercase tracking-wider text-sm md:text-lg xl:text-2xl">Tindakan Nyata Dasa Darma Hari Ini:</span> 
                          "{userData.ref5 || '-'}"
                      </p>
                    </div>
                  </div>

                  <div className="w-full max-w-3xl xl:max-w-5xl space-y-4 xl:space-y-6 mt-6">
                    {saveStatus === 'idle' && <button onClick={handleSaveToGoogleSheets} disabled={isSaving} className="bg-gradient-to-b from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-black w-full py-5 md:py-6 xl:py-8 rounded-full flex items-center justify-center gap-3 md:gap-5 text-xl md:text-3xl xl:text-4xl shadow-[0_8px_0_#1e3a8a] active:shadow-none active:translate-y-2 transition-all uppercase tracking-wide touch-manipulation">{isSaving ? "Menyimpan Logbook..." : <><Icons.Save className="w-6 h-6 md:w-8 md:h-8 xl:w-12 xl:h-12"/> Kumpul Logbook ke Pembina</>}</button>}
                    {saveStatus === 'success' && <div className="bg-green-100 text-green-800 p-6 xl:p-8 rounded-2xl text-center font-black text-xl xl:text-3xl border-4 border-green-400 shadow-sm">Logbook Berhasil Terkirim! ✅</div>}
                    {saveStatus === 'error' && <div className="bg-red-100 text-red-800 p-6 xl:p-8 rounded-2xl text-center font-black text-xl xl:text-3xl border-4 border-red-300 shadow-sm">Gagal terhubung dengan server Pembina. <button onClick={()=>setSaveStatus('idle')} className="underline text-red-700 ml-2 hover:text-red-900 transition-colors">Coba lagi</button></div>}
                    <button onClick={onRestart} className="bg-gradient-to-b from-amber-700 to-amber-900 hover:from-amber-600 hover:to-amber-800 text-white font-black w-full py-5 md:py-6 xl:py-8 rounded-full flex items-center justify-center gap-3 md:gap-5 text-xl md:text-3xl xl:text-4xl shadow-[0_8px_0_#451a03] active:shadow-none active:translate-y-2 transition-all uppercase tracking-wide touch-manipulation"><Icons.RefreshCcw className="w-6 h-6 md:w-8 md:h-8 xl:w-12 xl:h-12"/> Jelajah Ulang</button>
                  </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PetualanganPramuka />);
    </script>
</body>
</html>
